name: Backup automatico della versione operativa

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      BACKUP_BRANCH: BACKUP-2026-09-21-CUTTING-TOOLS-LAB
    steps:
      - name: Aggiorna il backup alla versione di main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sovrascrivi il backup con la versione appena resa operativa
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git push origin "origin/main:refs/heads/$BACKUP_BRANCH" --force

      - name: Crea snapshot orario immutabile
        run: |
          git fetch origin main
          git checkout -B main origin/main
          SNAPSHOT="backup-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$SNAPSHOT" origin/main
          git push origin "$SNAPSHOT"

      - name: Archivia Gestione utensili interni dal repository
        run: |
          git fetch origin "$BACKUP_BRANCH"
          git checkout -B "$BACKUP_BRANCH" "origin/$BACKUP_BRANCH"
          cp special-tools.json special-tools-utensili.json
          git add special-tools-utensili.json
          if git diff --cached --quiet; then
            echo "Nessuna variazione nell'archivio utensili interni."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "backup: Gestione utensili interni"
            git push origin "$BACKUP_BRANCH"
          fi
