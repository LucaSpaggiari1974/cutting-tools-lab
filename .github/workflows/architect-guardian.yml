name: Cutting Tools LAB · Architect Guardian

on:
  workflow_run:
    workflows:
      - Deploy Cutting Tool Lab to Cloudflare Worker
      - Cutting Tools LAB · aggiornamento continuo 24/7
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: cutting-tools-architect-guardian
  cancel-in-progress: true

jobs:
  guardian:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout versione pubblicata
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Controllo architetturale indipendente
        env:
          PUBLIC_BASE_URL: https://cutting-tools-lab.spaggiari.workers.dev
        run: python scripts/architect_guardian.py

      - name: Pubblica report Guardian
        if: always()
        run: |
          git status --short
          if [ -f architect-guardian-report.json ]; then
            cat architect-guardian-report.json
          fi

      - name: Conserva report Guardian
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architect-guardian-report
          path: architect-guardian-report.json
          if-no-files-found: ignore
