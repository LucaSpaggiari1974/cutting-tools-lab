name: Smart Manufacturer Photo Sync

on:
  schedule:
    - cron: "47 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync exact manufacturer photos
        run: python scripts/sync_manufacturer_photos.py
      - name: Commit photo database updates
        run: |
          git config user.name "cutting-tools-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json data/manufacturer-photo-sync-report.json
          if git diff --cached --quiet; then
            echo "No photo database changes detected."
          else
            git commit -m "Auto-sync exact manufacturer product photos"
            git push
          fi
