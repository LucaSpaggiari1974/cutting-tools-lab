name: Smart Manufacturer Photo Sync

on:
  push:
    paths:
      - "scripts/sync_manufacturer_photos.py"
      - ".github/workflows/manufacturer-photo-sync.yml"
  schedule:
    - cron: "47 3 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Sync exact manufacturer photos
        run: python scripts/sync_manufacturer_photos.py
      - name: Verify every catalog photo URL
        id: verify
        continue-on-error: true
        run: python scripts/verify_catalog_photos.py

      - name: Commit photo database updates
        run: |
          git config user.name "cutting-tools-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- catalog.json data/photo-runtime-verification.json; then
            echo "No catalog/photo verification changes detected."
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path("sw.js"); s=p.read_text(encoding="utf-8")
          m=re.search(r'(cutting-tools-lab-v)(\\d+)',s)
          if not m: raise SystemExit("SW cache version not found")
          n=int(m.group(2))+1
          p.write_text(s[:m.start(2)]+str(n)+s[m.end(2):],encoding="utf-8")
          print("Bumped SW cache to",n)
          PY
          git add catalog.json data/manufacturer-photo-sync-report.json data/photo-runtime-verification.json sw.js
          if git diff --cached --quiet; then
            echo "No photo database changes detected."
          else
            git commit -m "Auto-sync and verify exact manufacturer product photos"
            git push
          fi

      - name: Fail workflow if photo verification found errors
        if: steps.verify.outcome == 'failure'
        run: exit 1
