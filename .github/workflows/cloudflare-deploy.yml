name: Deploy Cutting Tool Lab to Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout versione aggiornata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verifica asset catalogo generato e versionato
        run: |
          python - <<'PY'
          import gzip, json
          with gzip.open('catalog.json.gz', 'rt', encoding='utf-8') as f:
              catalog = json.load(f)
          assert isinstance(catalog.get('items'), list) and catalog['items'], 'Catalogo compresso non valido'
          print('Catalogo versionato:', catalog.get('updatedAt'), len(catalog['items']))
          PY

      - name: Prepara asset statici senza JSON catalogo sovradimensionato
        run: |
          mkdir -p dist
          rsync -a --delete --exclude='catalog.json' --exclude='.git/' --exclude='node_modules/' --exclude='dist/' ./ dist/
          test -s dist/catalog.json.gz
          test ! -e dist/catalog.json
          echo "Asset statici preparati; catalog.json originale escluso, catalog.json.gz presente."

      - name: Verifica configurazione Wrangler
        run: npx wrangler@latest deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Worker
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
