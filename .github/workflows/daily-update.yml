name: Cutting Tools LAB · aggiornamento quotidiano

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cutting-tools-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa strumenti PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Punto di ripristino
        run: |
          mkdir -p backups
          cp catalog.json backups/catalog-before-update.json
          cp complete-tools.json backups/complete-tools-before-update.json

      - name: Verifica catalogo inserti e fonti ufficiali
        run: python scripts/daily_update.py

      - name: Estrazione cataloghi ufficiali correnti
        run: python scripts/official_catalog_ingest.py

      - name: Commit e push
        run: |
          git config user.name "Cutting Tools LAB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json update-status.json complete-tools.json official-catalog-extracted.json backups/catalog-latest.json backups/catalog-before-update.json backups/complete-tools-before-update.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
          else
            git commit -m "chore: indicizzazione cataloghi ufficiali correnti"
            git push origin main
          fi
