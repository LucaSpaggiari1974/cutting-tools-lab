name: Cutting Tools LAB · aggiornamento continuo 24/7

on:
  schedule:
    # Controllo e aggiornamento ogni ora, 24/7
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/official_catalog_ingest.py"
      - "scripts/promote_official_catalog.py"
      - "scripts/daily_update.py"
      - "official-catalog-sources.json"
      - "index.html"
      - "sw.js"
      - "worker.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - ".github/workflows/daily-update.yml"

permissions:
  contents: write

concurrency:
  group: cutting-tools-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa strumenti PDF
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Punto di ripristino
        run: |
          mkdir -p backups
          cp catalog.json backups/catalog-before-update.json
          cp complete-tools.json backups/complete-tools-before-update.json

      - name: Verifica HTML e JavaScript (Windows)
        shell: pwsh
        run: |
          @'
          import re, subprocess, tempfile
          from html.parser import HTMLParser
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          class Parser(HTMLParser):
              pass
          Parser().feed(html)
          scripts = re.findall("<script[^>]*>(.*?)</script>", html, flags=re.I | re.S)
          if not scripts:
              raise SystemExit("ERRORE: nessun blocco JavaScript trovato in index.html")
          for i, code in enumerate(scripts, 1):
              p = Path(tempfile.gettempdir()) / f"cutting-tools-lab-{i}.js"
              p.write_text(code, encoding="utf-8")
              result = subprocess.run(["node", "--check", str(p)], capture_output=True, text=True)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr)
                  raise SystemExit(f"ERRORE JavaScript nel blocco {i}")
          print(f"OK: HTML parsabile + {len(scripts)} blocchi JavaScript verificati con Node.")
          '@ | python -

      - name: Estrazione cataloghi ufficiali correnti
        run: python scripts/official_catalog_ingest.py

      - name: Promozione codici ufficiali verificabili
        run: python scripts/promote_official_catalog.py

      - name: Verifica catalogo, parametri e fonti ufficiali
        run: python scripts/daily_update.py

      - name: Verifica parametri pubblicabili
        run: |
          python - <<'PY'
          import json, sys
          c=json.load(open("catalog.json",encoding="utf-8"))
          rows=c.get("items",[])
          allowed={"Ingersoll","ISCAR","Kennametal","Sandvik Coromant","Seco Tools","Sumitomo Electric Hardmetal","Tungaloy","Walter"}
          unexpected=sorted({str(x.get("maker","")) for x in rows}-allowed)
          if unexpected:
              sys.exit(f"ERRORE: produttori non autorizzati nel catalogo: {unexpected}")
          for maker in sorted(allowed):
              m=[x for x in rows if str(x.get("maker","")).strip()==maker]
              tables=sum(bool(x.get("recommendedConditions")) for x in m)
              print(f"{maker}: items={len(m)} tabelle_parametri={tables}")
          print(f"OK: catalogo filtrato sui soli 8 produttori autorizzati; record={len(rows)}.")
          PY

      - name: Commit e push
        id: commit
        run: |
          git config user.name "Cutting Tools LAB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json manufacturers.json index.html sw.js worker.js manifest.webmanifest icon.svg update-status.json complete-tools.json official-catalog-extracted.json official-catalog-promotion-report.json backups/catalog-latest.json backups/catalog-before-update.json backups/complete-tools-before-update.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: indicizzazione cataloghi ufficiali correnti"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node per pubblicazione immediata
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprimi catalogo per asset Cloudflare
        if: steps.commit.outputs.changed == 'true'
        run: python -c "import gzip; data=open('catalog.json','rb').read(); packed=gzip.compress(data,compresslevel=9,mtime=0); open('catalog.json.gz','wb').write(packed); print('catalog.json.gz bytes:',len(packed))"

      - name: Prepara asset statici per Cloudflare
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p dist
          rsync -a --delete --exclude='catalog.json' --exclude='.git/' --exclude='node_modules/' --exclude='dist/' ./ dist/
          test -s dist/catalog.json.gz
          test ! -e dist/catalog.json
          echo "Asset statici pronti: catalogo compresso presente, JSON pesante escluso."

      - name: Pubblicazione immediata su Cloudflare
        if: steps.commit.outputs.changed == 'true'
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verifica immediata versione online
        if: steps.commit.outputs.changed == 'true'
        env:
          PUBLIC_BASE_URL: https://cutting-tools-lab.spaggiari.workers.dev
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          with open("catalog.json", encoding="utf-8") as f:
              local=json.load(f)
          expected=(local.get("updatedAt"), len(local.get("items", [])))
          url=os.environ["PUBLIC_BASE_URL"].rstrip("/")+"/catalog.json"
          last=None
          for attempt in range(12):
              try:
                  req=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"Cutting-Tools-LAB-Deploy-Verify/1.0"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      online=json.loads(r.read().decode("utf-8"))
                  got=(online.get("updatedAt"), len(online.get("items", [])))
                  print(f"Tentativo {attempt+1}: online={got} atteso={expected}")
                  if got == expected:
                      print("OK: catalogo aggiornato online.")
                      break
                  last=got
              except Exception as e:
                  last=str(e)
                  print(f"Tentativo {attempt+1}: {e}")
              time.sleep(5)
          else:
              raise SystemExit(f"ERRORE: Cloudflare non risulta aggiornato dopo il deploy. online={last} atteso={expected}")


  verify_windows:
    name: Verifica HTML + JavaScript su Windows
    needs: update
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verifica HTML e JavaScript con Node.js
        shell: pwsh
        run: |
          $html = Get-Content -Raw -Encoding UTF8 index.html
          if ([string]::IsNullOrWhiteSpace($html)) { throw "index.html vuoto" }
          if ($html -notmatch '<!doctype html>') { throw "DOCTYPE HTML mancante" }
          $scripts = [regex]::Matches($html, '(?is)<script[^>]*>(.*?)</script>')
          if ($scripts.Count -eq 0) { throw "Nessun blocco JavaScript trovato" }
          $i = 0
          foreach ($m in $scripts) {
            $i++
            $p = Join-Path $env:TEMP ("cutting-tools-lab-win-{0}.js" -f $i)
            Set-Content -Path $p -Value $m.Groups[1].Value -Encoding UTF8
            node --check $p
            if ($LASTEXITCODE -ne 0) { throw "Errore JavaScript nel blocco $i" }
          }
          Write-Host "OK Windows: HTML valido + $($scripts.Count) blocchi JavaScript verificati"
      - name: Verifica pubblicazione Cloudflare
        shell: pwsh
        run: |
          $base = "https://cutting-tools-lab.spaggiari.workers.dev"
          $home = Invoke-WebRequest -Uri $base -UseBasicParsing -TimeoutSec 30
          if ($home.StatusCode -ne 200) { throw "Homepage Cloudflare non raggiungibile" }
          $cat = Invoke-WebRequest -Uri ($base + "/catalog.json") -UseBasicParsing -TimeoutSec 30
          if ($cat.StatusCode -ne 200) { throw "catalog.json Cloudflare non raggiungibile" }
          $json = $cat.Content | ConvertFrom-Json
          if (-not $json.items) { throw "catalog.json pubblicato senza items" }
          $allowed = @("Ingersoll","ISCAR","Kennametal","Sandvik Coromant","Seco Tools","Sumitomo Electric Hardmetal","Tungaloy","Walter")
          $unexpected = @($json.items | Where-Object { $_.maker -notin $allowed } | Select-Object -ExpandProperty maker -Unique)
          if ($unexpected.Count -gt 0) { throw "Produttori non autorizzati pubblicati: $($unexpected -join ', ')" }
          Write-Host "OK Cloudflare: $($json.items.Count) record pubblicati, solo gli 8 produttori richiesti."
