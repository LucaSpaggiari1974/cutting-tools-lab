name: Cutting Tools LAB · aggiornamento quotidiano

on:
  schedule:
    - cron: "17 3 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cutting-tools-daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Aggiorna catalogo e foto dai produttori ufficiali
        run: python scripts/daily_update.py

      - name: Commit automatico se necessario
        run: |
          git config user.name "Cutting Tools LAB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json update-status.json backups/catalog-latest.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
          else
            git commit -m "chore: aggiornamento quotidiano catalogo produttori"
            git push
          fi
