name: Deploy Cutting Tools LAB
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Crea versione build per aggiornamento automatico
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          with open("build-version.json","w",encoding="utf-8") as f:
              json.dump({"sha":os.environ.get("BUILD_SHA",""),"updatedAt":datetime.now(timezone.utc).isoformat()},f)
          PY
      - uses: actions/configure-pages@v5
      - name: Verifica JavaScript applicazione
        run: |
          python - <<'PY'
          import re
          s=open("index.html",encoding="utf-8").read()
          scripts=re.findall(r"<script[^>]*>(.*?)</script>",s,re.I|re.S)
          assert scripts, "Nessun blocco JavaScript trovato"
          open("/tmp/app.js","w",encoding="utf-8").write(scripts[-1])
          PY
          node --check /tmp/app.js
          node --check sw.js
      - name: Importa database memoria
        run: python merge_catalog.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
