name: Smart ISCAR Catalog Sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PDF parser
        run: python -m pip install --upgrade pymupdf
      - name: Sync official ISCAR catalogue
        run: python scripts/sync_iscar.py
      - name: Commit database updates
        run: |
          git config user.name "cutting-tools-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.json data/iscar-sync-report.json
          if git diff --cached --quiet; then
            echo "No catalogue changes detected."
          else
            git commit -m "Auto-sync official ISCAR turning catalogue"
            git push
          fi
